name: Test

# Runs TeamCode's tests against the simulator, and builds the competition APK, on every push and
# pull request. GitHub's Ubuntu runners already have the Android SDK (ANDROID_HOME, android-34,
# build-tools 34.0.0), so the only setup is a JDK.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Gradle 9.1 and Android Gradle Plugin 8.13.2 need JDK 17 or later. The tests pass on 21 and 25.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Test against the simulator
        run: ./gradlew :TeamCode:testSimulatedDebugUnitTest

      - name: Build the competition APK
        run: ./gradlew :TeamCode:assembleRobotDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: TeamCode/build/reports/tests/
          if-no-files-found: ignore
